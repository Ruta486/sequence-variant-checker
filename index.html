<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多读段序列比对</title><style>
*{box-sizing:border-box}body{font:15px/1.55 'Segoe UI','Microsoft Yahei',sans-serif;background:#f4f7f4;color:#192720;max-width:1050px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #dce6df;border-radius:14px;padding:20px;margin:16px 0}h1{margin:5px 0}.hint,small{color:#63736a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{font-weight:bold;display:block;margin:8px 0}textarea{width:100%;height:170px;padding:12px;border:1px solid #cbd8cf;border-radius:8px;font:13px/1.5 Consolas,monospace}.file{padding:12px;background:#f3f8f4;margin-top:8px;border-radius:8px}button{background:#16734b;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:bold}.err{color:#b51f27}.result{border-top:1px solid #ddd;padding:18px 0}.result:first-child{border:0}.seq{font:14px/1.75 Consolas,monospace;overflow:auto;background:#f8faf9;border:1px solid #e5ece7;border-radius:9px;padding:12px;margin:10px 0}.alrow{display:grid;grid-template-columns:112px max-content;gap:12px;align-items:center;white-space:pre;min-width:max-content;min-height:24px}.alabel{font:12px/1.4 "Microsoft Yahei",sans-serif;color:#607168}.altext{white-space:pre;font-family:Consolas,monospace}.aaRow{color:#256c4b;background:#eef6f0}.aaRow .mut{color:#b51f27;background:#ffe0e0;border-radius:3px}.result{padding:18px 0}.meta{font-size:12px;margin:6px 0 10px}.mut{color:#c5232c;font-weight:bold}.gap{color:#c5232c;font-weight:bold}.insert{color:#c5232c;font-weight:bold}.meta{color:#64746b}.badge{float:right}.aa{font:14px/1.9 Consolas,monospace;overflow-wrap:anywhere}.aa .mut{background:#ffe5e5}.empty{padding:18px;color:#63736a}@media(max-width:700px){.grid{grid-template-columns:1fr}}
+</style><main><small>REFERENCE-GUIDED READ ASSEMBLY</small><h1>目标序列与测序读段比对</h1><div class="hint">一次选入的多条测序读段会一起与目标序列对齐（方向自动识别）。以目标序列为基准，目标外侧载体/引物等额外序列不参与差异标注。</div><section class="card"><div class="grid"><div><label>目标序列（参考；可含多条 FASTA）</label><textarea id="ref" placeholder=">基因A&#10;ATG..."></textarea><div class="file">批量上传目标序列 <input id="rf" type="file" multiple accept=".seq,.fasta,.fa,.fna,.fas,.txt"><div id="rfiles" class="hint">尚未载入目标文件</div></div></div><div><label>测序读段（多个文件共同组装）</label><textarea id="reads" placeholder=">正向读段&#10;ATGG...&#10;>反向读段&#10;..."></textarea><div class="file">同时选择正向、反向及其他读段文件 <input id="qf" type="file" multiple accept=".seq,.fasta,.fa,.fna,.fas,.txt"><div id="qfiles" class="hint">尚未载入测序文件</div></div></div></div><p><button id="run">共同对齐并分析</button> <button id="clear" style="background:white;color:#16734b;border:1px solid #b9d2c3">清空</button> <span id="status" class="hint">多次选择的文件会累加；同一目标的读段和目标一起对齐显示。</span></p><div id="err" class="err"></div></section><section class="card"><h2>分析结果</h2><small>仅在测序读段共识中标红与目标不同的碱基；未覆盖位置显示 ·。目标序列始终作为基准。氨基酸按目标第 1 位（通常 ATG）起始阅读框计算。</small><div id="out" class="empty">等待序列。</div></section></main>
<script>
const $=s=>document.querySelector(s),comp={A:'T',T:'A',C:'G',G:'C',N:'N'};let rn=[],qn=[];
function parse(t){let a=[],name='',seq='';for(let l of t.split(/[\r\n]+/)){l=l.trim();if(!l)continue;if(l[0]=='>'){if(seq)a.push({name:name||'序列'+(a.length+1),seq});name=l.slice(1).trim()||'序列'+(a.length+1);seq=''}else seq+=l.replace(/[\s\d]/g,'')}if(seq)a.push({name:name||'序列'+(a.length+1),seq});return a}function clean(s){return s.toUpperCase().replace(/U/g,'T').replace(/[^ACGTN]/g,'')}function rc(s){return [...s].reverse().map(x=>comp[x]||'N').join('')}
function local(r,q){let n=r.length,m=q.length;if((n+1)*(m+1)>12e6)throw Error('序列过长，请分段处理。');let w=m+1,S=(n+1)*w,H=new Int32Array(S),P=new Int8Array(S),best=0,bk=0;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){let k=i*w+j,diag=H[k-w-1]+(r[i-1]===q[j-1]?2:-2),up=H[k-w]-3,left=H[k-1]-3,v=Math.max(0,diag,up,left);H[k]=v;P[k]=v===0?0:v===diag?1:v===up?2:3;if(v>best){best=v;bk=k}}let i=Math.floor(bk/w),j=bk%w,cols=[];while(i>0&&j>0&&H[i*w+j]>0){let k=i*w+j,p=P[k];if(p===1){cols.push([i-1,q[j-1]]);i--;j--}else if(p===2){cols.push([i-1,'-']);i--}else if(p===3){cols.push([i,'+'+q[j-1]]);j--}else break}cols.reverse();return{score:best,cols}}
function orient(r,q){let a=local(r,q),b=local(r,rc(q));return b.score>a.score?{...b,rev:true}:{...a,rev:false}}
const T={};for(const [aa,cs]of Object.entries({F:'TTT TTC',L:'TTA TTG CTT CTC CTA CTG',S:'TCT TCC TCA TCG AGT AGC',Y:'TAT TAC',C:'TGT TGC',W:'TGG',P:'CCT CCC CCA CCG',H:'CAT CAC',Q:'CAA CAG',R:'CGT CGC CGA CGG AGA AGG',I:'ATT ATC ATA',M:'ATG',T:'ACT ACC ACA ACG',N:'AAT AAC',K:'AAA AAG',V:'GTT GTC GTA GTG',A:'GCT GCC GCA GCG',D:'GAT GAC',E:'GAA GAG',G:'GGT GGC GGA GGG','*':'TAA TAG TGA'}))for(const c of cs.split(' '))T[c]=aa;function tr(s){let a='';for(let i=0;i+2<s.length;i+=3)a+=T[s.slice(i,i+3)]||'X';return a}function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function assemble(ref,reads){let calls=Array.from({length:ref.length},()=>({A:0,C:0,G:0,T:0,'-':0,N:0})),covered=Array(ref.length).fill(0),ins={};let mapped=[];for(const rd of reads){let al=orient(ref,rd.seq);for(const [pos,ch]of al.cols){if(typeof pos==='string'||ch[0]==='+'){let ix=typeof pos==='number'?pos:0,key=Math.max(0,Math.min(ref.length,ix));(ins[key]??=[]).push(ch[0]==='+'?ch.slice(1):'');continue}calls[pos][ch]=(calls[pos][ch]||0)+1;covered[pos]++}mapped.push({name:rd.name,rev:al.rev,score:al.score,cols:al.cols})}let cons='',mut=0,del=0,unc=0;for(let i=0;i<ref.length;i++){if(!covered[i]){cons+='·';unc++;continue}let best='N',mx=-1;for(let b of 'ACGT-')if(calls[i][b]>mx){mx=calls[i][b];best=b}cons+=best;if(best!==ref[i]){if(best==='-')del++;else mut++}}return{cons,calls,covered,mapped,mut,del,unc,ins}}
function readLabel(name,index){let base=name.replace(/\.[^.]+$/,'');let parts=base.split('-');return parts.length>=4&&parts[2]?parts[2].trim():`读段${index+1}`}function renderGroup(g,reads){let maps=reads.map(rd=>{let al=orient(g.seq,rd.seq),covered=Array(g.seq.length).fill(null),insAt={};for(let [pos,ch]of al.cols){if(typeof ch==='string'&&ch[0]==='+'){if(pos>0&&pos<g.seq.length)insAt[pos]=(insAt[pos]||'')+ch.slice(1)}else covered[pos]=ch}return{rd,al,covered,insAt}});let chunks='';for(let st=0;st<g.seq.length;st+=60){let end=Math.min(g.seq.length,st+60),target='',aaTarget='';let rows=maps.map(()=>({seq:'',aa:''}));for(let i=st;i<end;i++){let n=Math.max(0,...maps.map(m=>(m.insAt[i]||'').length));if(n){target+='-'.repeat(n);aaTarget+=' '.repeat(n);maps.forEach((m,j)=>{let ins=m.insAt[i]||'';rows[j].seq+=ins+'-'.repeat(n-ins.length);rows[j].aa+=' '.repeat(n)})}if(i%3===1){aaTarget+=T[g.seq.slice(i-1,i+2)]||'X';maps.forEach((m,j)=>{let cod=m.covered.slice(i-1,i+2),v=cod.length<3||cod.some(x=>x===null)?'·':cod.includes('-')?'X':tr(cod.join(''));rows[j].aa+=v})}else{aaTarget+=' ';maps.forEach((m,j)=>rows[j].aa+=' ')}target+=g.seq[i];maps.forEach((m,j)=>rows[j].seq+=m.covered[i]===null?'·':m.covered[i])}let body=`<div class="alrow aaRow"><span class="alabel">氨基酸 · 目标</span><span class="altext">${esc(aaTarget)}</span></div><div class="alrow"><span class="alabel">DNA · 目标 ${st+1}–${end}</span><span class="altext">${esc(target)}</span></div>`;maps.forEach((m,j)=>{let aaHtml='';for(let k=0;k<rows[j].aa.length;k++){let ch=rows[j].aa[k],refch=aaTarget[k];aaHtml+=ch!==' '&&ch!=='·'&&ch!==refch?`<span class="mut">${esc(ch)}</span>`:esc(ch)}let nuc='';for(let k=0;k<target.length;k++){let ch=rows[j].seq[k];nuc+=ch!=='·'&&ch!==target[k]?`<span class="mut">${esc(ch)}</span>`:esc(ch)}let shortName=readLabel(m.rd.name,j);body+=`<div class="alrow aaRow"><span class="alabel">氨基酸 · ${shortName}</span><span class="altext">${aaHtml}</span></div><div class="alrow"><span class="alabel">DNA · ${shortName}</span><span class="altext">${nuc}</span></div>`});chunks+=`<div class="seq">${body}</div>`}let summary=maps.map((m,j)=>{let sub=0,del=0,ins=Object.values(m.insAt).reduce((s,x)=>s+x.length,0),covered=0;for(let i=0;i<g.seq.length;i++)if(m.covered[i]!==null){covered++;if(m.covered[i]==='-')del++;else if(m.covered[i]!==g.seq[i])sub++}return `${esc(readLabel(m.rd.name,j))}（${m.al.rev?'反向互补':'正向'}）：替换 ${sub}、缺失 ${del}、插入 ${ins}、覆盖 ${covered} bp`}).join('<br>');return `<article class="result"><b>目标：${esc(g.name)}　｜　目标序列 1 条 + 测序读段 ${maps.length} 条</b><div class="meta">目标 CDS 从 ATG 开始；目标坐标从 ATG 的 A 计为 1。${g.trim>0?`已跳过 ATG 前 ${g.trim} bp。`:``}读段覆盖外显示 ·；目标范围外读段序列忽略。</div>${chunks}<div class="meta">${summary}</div><small>氨基酸字母居中对应下方三联体密码子；红色只标测序读段的差异。· 表示未覆盖，X 表示含缺口密码子。</small><p><a target="_blank" rel="noopener" href="https://ricerc.sicau.edu.cn/RiceRC/tools/blastBefore?seq=#result">RiceRC BLAST</a></p></article>`}async function load(input,target){let chunks=[],names=[];for(let f of input.files){let t=await f.text();chunks.push(t.trim().startsWith('>')?t:'>'+f.name+'\n'+t);names.push(f.name)}let ta=target?$('#ref'):$('#reads');ta.value+=(ta.value?'\n':'')+chunks.join('\n');if(target){rn.push(...names);$('#rfiles').textContent=`累计载入 ${rn.length} 个目标文件：${rn.join('、')}`}else{qn.push(...names);$('#qfiles').textContent=`累计载入 ${qn.length} 个测序文件：${qn.join('、')}`}}
$('#rf').onchange=e=>load(e.target,true);$('#qf').onchange=e=>load(e.target,false);$('#run').onclick=()=>{try{$('#err').textContent='';let genes=parse($( '#ref' ).value).map(x=>{let s=clean(x.seq),i=s.indexOf('ATG');return {...x,seq:i>=0?s.slice(i):s,trim:i}}).filter(x=>x.seq),reads=parse($('#reads').value).map(x=>({...x,seq:clean(x.seq)})).filter(x=>x.seq);if(!genes.length||!reads.length)throw Error('请提供目标序列和至少一条测序读段。');let groups=new Map(genes.map(g=>[g,[]]));for(let rd of reads){let best=null,bestScore=-1;for(let g of genes){let z=orient(g.seq,rd.seq).score;if(z>bestScore){bestScore=z;best=g}}if(best)groups.get(best).push(rd)}$('#out').innerHTML=[...groups].filter(([,v])=>v.length).map(([g,v])=>renderGroup(g,v)).join('');$('#status').textContent=`${genes.length} 个目标；${reads.length} 条读段已按目标分组并显示在同一对齐中。`}catch(e){$('#err').textContent=e.message}};$('#clear').onclick=()=>{ref.value='';reads.value='';rf.value='';qf.value='';rn=[];qn=[];rfiles.textContent='尚未载入目标文件';qfiles.textContent='尚未载入测序文件';out.textContent='等待序列。';out.className='empty';err.textContent=''};
</script></html>
